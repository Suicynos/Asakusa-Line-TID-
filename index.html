<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0D1B2A">
<title>都営浅草線 列車走行位置</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script>
  // ちらつき防止のため、CSSより先にテーマ属性を設定
  try {
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) {}
</script>
</head>
<body>

<div id="app">

  <header class="app-header">
    <div class="app-header__left">
      <div class="line-symbol" aria-hidden="true">
        <span class="line-symbol__inner">A</span>
      </div>
      <h1 class="app-header__title">都営浅草線　列車走行位置</h1>
    </div>
    <div class="app-header__right">
      <div class="updated-label">最終更新</div>
      <div id="updated-time" class="updated-time">--:--:--</div>
    </div>
  </header>

  <div id="info-banner" class="info-banner" hidden>
    <span class="info-banner__icon" aria-hidden="true">&#9888;</span>
    <span id="info-banner__text"></span>
  </div>

  <main class="board-wrap">
    <div id="board" class="board noscroll">
      <!-- JSで生成 -->
    </div>
  </main>

  <footer class="app-footer">
    <span id="conn-status" class="conn-status"></span>
    <span class="credit">出典: 公共交通オープンデータセンター（ODPT）</span>
  </footer>

  <button id="settings-btn" class="settings-btn" aria-label="設定">&#9881;</button>

  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-panel-inner">
      <h2>設定</h2>
      <label class="settings-field">
        ODPT APIキー（consumerKey）
        <input id="api-key-input" type="text" placeholder="お持ちのODPTコンシューマーキーを入力">
      </label>
      <label class="theme-toggle">
        黒基調（ダークテーマ）
        <input id="theme-toggle-input" type="checkbox">
      </label>
      <p class="settings-note">
        キー未設定の場合はサンプルデータで動作を確認できます。
        キーは <a href="https://developer.odpt.org/" target="_blank" rel="noopener">ODPT Developer サイト</a> から取得してください。
      </p>
      <div class="settings-actions">
        <button id="settings-save" class="btn btn--primary">保存して再読み込み</button>
        <button id="settings-close" class="btn">閉じる</button>
      </div>
    </div>
  </div>

</div>

<script src="stations.js"></script>
<script src="app.js"></script>
</body>
</html>
